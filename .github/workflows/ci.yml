name: Site CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/site-rebuild-approved-v2

jobs:
  verify:
    name: Type Check, Build & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Production route smoke
        run: npm run smoke
